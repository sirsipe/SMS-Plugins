; Anville Mono — Schwarz / Weiß / Creme + Kupfer-Akzent (zum Vinyl-Background)
[skin]
version=1
name=White Cadillac Vinyl

[images]
background=vinyl.png

[colors]
; Base surfaces (warmes Elfenbein)
canvas=#F2ECE0
surface=#FAF5EC
surfaceRaised=#FFFEFB
outline=#D8CDB8

; Text: BEIDE dunkel -> lesbar auf allen hellen Flaeche UND hellen Buttons
