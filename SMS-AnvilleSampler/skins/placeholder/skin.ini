; SMS-Anville Sampler skin v1. Copy this folder as skin inside the plugin bundle.
; Missing entries use built-in defaults. Edit values, then reopen the editor.
; Comments occupy their own line. Values are literal (no quotes or escapes).
[skin]
version=1
name=Anville Dark

[images]
; Background stretches over the chassis, behind panels and controls.
background=background.png
; Logo stretches into the existing header logo rectangle.
logo=logo.png

[colors]
; All semantic and physical material colors; optional trailing AA is alpha.
canvas=#0F0F12
surface=#1B1B21
surfaceRaised=#27272F
outline=#454451
contentPrimary=#E8E1D6
contentSecondary=#AEA69C
activityPlayback=#E83744
activityCapture=#FF5E4D
selection=#FF4A5B
controlAccent=#E83744
controlActive=#9A2A30
controlActiveContent=#C64E50
intentDanger=#FF1E37
meterGreen=#4BD370
meterYellow=#F5C642
meterRed=#EF5360
logoGlow=#FFD600
chassisTop=#262627
chassisBottom=#161618
chassisEdge=#5B5853
recess=#0D0D0F
recessEdge=#070708
panelTop=#1F1F20
panelBottom=#161618
rubberTop=#2F2E2E
rubberBottom=#19191B
controlTop=#302F2F
controlBottom=#1B1B1D
edgeHighlight=#978F84
shadow=#000000
faderTop=#FFFAE7
faderBottom=#BFB596
; Saved pad indices stay in this fixed order; recolor without reordering.
pad1=#E0434B
pad2=#EB8934
pad3=#E6C43E
pad4=#53C066
pad5=#5096E0
pad6=#AC6BD7

[metrics]
; Alpha values: 0..1. Radii and outline width: 0..24 logical pixels.
; Image, pad surfaces, main pad-bank backing, and right-side backing opacity.
; Panel opacity includes borders, shadows and grain; labels/controls stay clear.
backgroundAlpha=1.0
padAlpha=1.0
padPanelAlpha=1.0
controlPanelAlpha=1.0
padTintAlpha=0.32
panelRadius=12.0
controlRadius=6.0
outlineWidth=1.0
materialGrainAlpha=0.035
shallowShadowAlpha=0.48
bevelHighlightAlpha=0.28
disabledAlpha=0.38
hoverFillAlpha=0.07
hoverMenuFillAlpha=0.10
hoverHaloAlpha=0.50
; Logo glow: alpha/radius 0 disables; pulse 0 is steady, otherwise 0..60 seconds.
logoGlowAlpha=0.0
logoGlowRadius=10.0
logoGlowPulseSeconds=3.0

