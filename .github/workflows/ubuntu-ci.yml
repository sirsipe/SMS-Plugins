name: Ubuntu CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        type: string
        default: ''
      help-ref:
        type: string
        default: main
      artifact-name:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ubuntu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
      HELP_REF: ${{ inputs.help-ref || 'main' }}

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config git python3 \
            lv2-dev lilv-utils libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev libdbus-1-dev

      - name: Configure VST3, LV2 and experimental CLAP
        run: |
          cmake -S SMS-AnvilleSampler -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DANVILLESAMPLER_BUILD_VST3=ON \
            -DANVILLESAMPLER_BUILD_CLAP=ON \
            -DANVILLESAMPLER_HELP_REF="$HELP_REF"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate bundles
        run: |
          test -f build/bin/SMS-AnvilleSampler.lv2/SMS-AnvilleSampler_dsp.so
          test -f build/bin/SMS-AnvilleSampler.lv2/SMS-AnvilleSampler_ui.so
          test -f build/bin/SMS-AnvilleSampler.vst3/Contents/x86_64-linux/SMS-AnvilleSampler.so
          test -f build/bin/SMS-AnvilleSampler.clap
          LV2_PATH="$PWD/build/bin" \
            lv2info https://github.com/sirsipe/SMS-Plugins/SMS-AnvilleSampler \
            | grep -E '^[[:space:]]*Name:[[:space:]]+SMS-Anville Sampler$'

      - name: Package ZIPs and matching source
        if: github.event_name == 'workflow_dispatch' || inputs.package-version != ''
        shell: bash
        run: |
          mkdir -p dist
          package_version="${PACKAGE_VERSION:-${GITHUB_SHA::12}}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/package_plugins.py --build-dir build --output-directory dist \
            --platform Linux --version "$package_version"
          python3 scripts/package_source.py \
            --output "dist/SMS-AnvilleSampler-${package_version}-Linux-x64-source.tar.gz" \
            --prefix SMS-Plugins
          python3 scripts/package_plugins.py --output-directory dist --checksums-only

      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch' || inputs.package-version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name || format('SMS-AnvilleSampler-{0}-linux-x86_64', github.sha) }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
