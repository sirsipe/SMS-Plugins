name: Ubuntu CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            lv2-dev lilv-utils libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev

      - name: Configure LV2 and VST3
        run: |
          cmake -S SMS-Midichopper -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DMIDICHOPPER_BUILD_VST3=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate bundles
        run: |
          test -f build/bin/SMS-Midichopper.lv2/SMS-Midichopper_dsp.so
          test -f build/bin/SMS-Midichopper.lv2/SMS-Midichopper_ui.so
          test -f build/bin/SMS-Midichopper.vst3/Contents/x86_64-linux/SMS-Midichopper.so
          LV2_PATH="$PWD/build/bin" \
            lv2info https://github.com/sirsipe/SMS-Plugins/SMS-Midichopper

      - name: Package manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p dist
          archive_prefix="SMS-Midichopper-${GITHUB_SHA::12}-linux-x86_64"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 \
            --numeric-owner -C build/bin -czf "dist/${archive_prefix}-lv2.tar.gz" \
            SMS-Midichopper.lv2
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 \
            --numeric-owner -C build/bin -czf "dist/${archive_prefix}-vst3.tar.gz" \
            SMS-Midichopper.vst3
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt)

      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SMS-Midichopper-${{ github.sha }}-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
