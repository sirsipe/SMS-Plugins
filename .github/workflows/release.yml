name: Release

on:
  push:
    tags:
      - SMS-AnvilleSampler-v*

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches project version
        id: version
        shell: bash
        run: |
          tag_version="$(python3 scripts/release_version.py --tag "$GITHUB_REF_NAME")"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: verify-version
    uses: ./.github/workflows/ubuntu-ci.yml
    with:
      package-version: v${{ needs.verify-version.outputs.version }}
      help-ref: ${{ github.ref_name }}
      artifact-name: release-linux

  build-windows:
    needs: verify-version
    uses: ./.github/workflows/windows-ci.yml
    with:
      package-version: v${{ needs.verify-version.outputs.version }}
      help-ref: ${{ github.ref_name }}
      artifact-name: release-windows

  publish:
    needs: [verify-version, build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: v${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tested platform packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify release assets and combine checksums
        run: |
          for suffix in Linux-x64-vst3.zip Linux-x64-lv2.zip Windows-x64-experimental-vst3.zip Linux-x64-source.tar.gz Windows-x64-source.tar.gz; do
            test -s "dist/SMS-AnvilleSampler-${RELEASE_VERSION}-${suffix}"
          done
          python3 scripts/package_plugins.py --output-directory dist --checksums-only

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'EOF'
          Download the ZIP for your platform and format. Linux VST3 is preferred;
          Windows VST3 is experimental.

          Extract and copy the whole plugin folder, including skins and licenses:
          - Linux VST3: `~/.vst3/`
          - Linux LV2: `~/.lv2/`
          - Windows VST3: `C:\Program Files\Common Files\VST3\`

          Restart your DAW or rescan plugins.

          Corresponding source, including the pinned DPF and Pugl dependencies,
          is available in the matching platform's `*-source.tar.gz` asset below.
          The Windows source also includes its additional OpenGL headers. Build instructions
          are included in `SMS-AnvilleSampler/README.md` inside that archive.
          Keep this source asset available alongside the binary downloads.
          EOF
          release_flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file release-notes.txt \
            "${release_flags[@]}" \
            --title "SMS-Anville Sampler $RELEASE_VERSION"
